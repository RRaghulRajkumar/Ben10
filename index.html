    <script>
        /********************************************************************
         * 1. WEB AUDIO API SYNTHESIZER & DYNAMIC BEN 10 SOUNDTRACK
         ********************************************************************/
        class Ben10SoundSystem {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.musicGain = null;
                this.sfxGain = null;
                this.musicEnabled = true;
                this.sfxEnabled = true;
                this.volume = 0.65;
                this.tempoMultiplier = 1.0;
                this.isPlayingMusic = false;
                this.stepIndex = 0;
                this.musicTimer = null;
                this.isUltimateMode = false;
                this.selectedTrackMode = 'auto';
                this.customAudio = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return;
                    this.ctx = new AudioCtx();
                    this.masterGain = this.ctx.createGain();
                    this.musicGain = this.ctx.createGain();
                    this.sfxGain = this.ctx.createGain();

                    this.musicGain.connect(this.masterGain);
                    this.sfxGain.connect(this.masterGain);
                    this.masterGain.connect(this.ctx.destination);
                    this.updateVolumes();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => {});
                }
            }

            updateVolumes() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                this.masterGain.gain.setTargetAtTime(this.volume, now, 0.02);
                this.musicGain.gain.setTargetAtTime(this.musicEnabled ? 0.32 : 0, now, 0.03);
                this.sfxGain.gain.setTargetAtTime(this.sfxEnabled ? 0.65 : 0, now, 0.02);
            }

            syncAutoForm(isUlt) {
                this.isUltimateMode = !!isUlt;
            }

            toggleMusic() {
                this.init();
                this.musicEnabled = !this.musicEnabled;
                this.updateVolumes();
                if (this.musicEnabled && !this.isPlayingMusic) {
                    this.startMusic();
                }
                return this.musicEnabled;
            }

            startMusic() {
                this.init();
                if (!this.ctx || this.isPlayingMusic) return;
                this.isPlayingMusic = true;
                this.scheduleNextBeat();
            }

            scheduleNextBeat() {
                if (!this.isPlayingMusic) return;
                if (this.musicEnabled && this.ctx && this.ctx.state === 'running') {
                    this.playSequencerStep(this.stepIndex);
                    this.stepIndex = (this.stepIndex + 1) % 16;
                }
                const stepMs = Math.max(95, 155 / Math.min(1.6, this.tempoMultiplier));
                this.musicTimer = setTimeout(() => this.scheduleNextBeat(), stepMs);
            }

            playSequencerStep(step) {
                const now = this.ctx.currentTime;
                const bassNotes = this.isUltimateMode
                    ? [65.41, 65.41, 77.78, 65.41, 87.31, 77.78, 98.00, 77.78]
                    : [73.42, 73.42, 87.31, 73.42, 98.00, 87.31, 110.00, 87.31];
                const leadNotes = this.isUltimateMode
                    ? [261.63, 311.13, 349.23, 392.00, 466.16, 392.00, 349.23, 311.13]
                    : [293.66, 349.23, 392.00, 440.00, 523.25, 440.00, 392.00, 349.23];

                // Driving Bassline
                if (step % 2 === 0) {
                    const bOsc = this.ctx.createOscillator();
                    const bGain = this.ctx.createGain();
                    bOsc.type = 'sawtooth';
                    bOsc.frequency.setValueAtTime(bassNotes[(step / 2) % bassNotes.length], now);
                    bGain.gain.setValueAtTime(0.18, now);
                    bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                    bOsc.connect(bGain);
                    bGain.connect(this.musicGain);
                    bOsc.start(now);
                    bOsc.stop(now + 0.15);
                }

                // Heroic Lead Synth
                if (step % 2 === 1 || step === 0 || step === 8) {
                    const lOsc = this.ctx.createOscillator();
                    const lGain = this.ctx.createGain();
                    lOsc.type = this.isUltimateMode ? 'square' : 'triangle';
                    lOsc.frequency.setValueAtTime(leadNotes[step % leadNotes.length], now);
                    lGain.gain.setValueAtTime(0.12, now);
                    lGain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
                    lOsc.connect(lGain);
                    lGain.connect(this.musicGain);
                    lOsc.start(now);
                    lOsc.stop(now + 0.14);
                }
            }

            playJump() {
                if (!this.sfxEnabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(580, now + 0.16);
                g.gain.setValueAtTime(0.3, now);
                g.gain.exponentialRampToValueAtTime(0.01, now + 0.17);
                osc.connect(g);
                g.connect(this.sfxGain);
                osc.start(now);
                osc.stop(now + 0.18);
            }

            playStomp(heavy = false) {
                if (!this.sfxEnabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(heavy ? 95 : 130, now);
                osc.frequency.exponentialRampToValueAtTime(28, now + (heavy ? 0.14 : 0.08));
                g.gain.setValueAtTime(heavy ? 0.28 : 0.12, now);
                g.gain.exponentialRampToValueAtTime(0.001, now + (heavy ? 0.15 : 0.09));
                osc.connect(g);
                g.connect(this.sfxGain);
                osc.start(now);
                osc.stop(now + (heavy ? 0.16 : 0.1));
            }

            playShoot() {
                if (!this.sfxEnabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(680, now);
                osc.frequency.exponentialRampToValueAtTime(160, now + 0.18);
                g.gain.setValueAtTime(0.32, now);
                g.gain.exponentialRampToValueAtTime(0.01, now + 0.19);
                osc.connect(g);
                g.connect(this.sfxGain);
                osc.start(now);
                osc.stop(now + 0.2);
            }

            playTongueGrab() {
                if (!this.sfxEnabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(260, now);
                osc.frequency.linearRampToValueAtTime(720, now + 0.09);
                osc.frequency.linearRampToValueAtTime(340, now + 0.2);
                g.gain.setValueAtTime(0.35, now);
                g.gain.exponentialRampToValueAtTime(0.01, now + 0.21);
                osc.connect(g);
                g.connect(this.sfxGain);
                osc.start(now);
                osc.stop(now + 0.22);

            playExplosion() {
                if (!this.sfxEnabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const bufferSize = this.ctx.sampleRate * 0.22;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.35));
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const g = this.ctx.createGain();
                g.gain.setValueAtTime(0.38, now);
                g.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                noise.connect(g);
                g.connect(this.sfxGain);
                noise.start(now);
            }

                if (!this.sfxEnabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;

                    const g = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.05);
                    g.gain.setValueAtTime(0.22, now + idx * 0.05);
                    g.gain.exponentialRampToValueAtTime(0.008, now + idx * 0.05 + 0.14);
                    osc.connect(g);
                    g.connect(this.sfxGain);
                    osc.start(now + idx * 0.05);
                    osc.stop(now + idx * 0.05 + 0.15);

                    spawnFloatingText(obs.x, obs.y - 12, "SLAM SHATTER +25!", cfg.accentColor, 14);
                    obstacles.splice(i, 1);
                }
            }
        }

        function triggerAlienSpecial() {
            audio.init();
            if (gameState !== 'PLAYING') {
                startGame();
                return;
            }

            const cfg = ALIEN_ROSTER[currentAlienKey];

            // Special Case: UPCHUCK (Secret Code 'RRR') — Tongue Grab Obstacle & Spit Explosive Acid!
            if (currentAlienKey === 'upchuck') {
                const grabTargetIdx = obstacles.findIndex(o => o.x > player.x && o.x < player.x + 390);
                if (grabTargetIdx !== -1 && upchuckSwallowedCount < 3) {
                    const targetObs = obstacles[grabTargetIdx];
                    activeTongueGrab = {
                        targetX: targetObs.x + targetObs.w / 2,
                        targetY: targetObs.y + targetObs.h / 2,
                        timer: 0.24,
                        maxTimer: 0.24
                    };
                    upchuckSwallowedCount++;
                    bonusScore += 40;
                    audio.playTongueGrab();
                    spawnExplosion(targetObs.x + targetObs.w / 2, targetObs.y + targetObs.h / 2, '#a3e635', 16);
                    spawnFloatingText(targetObs.x, targetObs.y - 12, "TONGUE GULP +40!", "#a3e635", 15);
                    obstacles.splice(grabTargetIdx, 1);
                    updateHUD();
                    return;
                } else if (upchuckSwallowedCount > 0 || missileAmmo > 0) {
                    if (upchuckSwallowedCount > 0) upchuckSwallowedCount--;
                    else missileAmmo--;
                    audio.playShoot();
                    shootRecoilTimer = 0.16;
                    missiles.push({
                        x: player.x + player.width - 4,
                        y: player.y + 18,
                        w: 28,
                        h: 22,
                        vx: 780,
                        kind: 'upchuck_spit',
                        color: '#a3e635',
                        pierce: isUltimate ? 3 : 2,
                        trailTimer: 0
                    });
                    spawnFloatingText(player.x + 20, player.y - 12, "GOURMAND ACID SPIT!", "#bef264", 14);
                    updateHUD();
                    return;
                }
            }

            if (missileAmmo <= 0) {
                spawnFloatingText(player.x + 10, player.y - 12, "RECHARGING ENERGY...", "#94a3b8", 13);
                return;
            }

            missileAmmo--;
            shootRecoilTimer = 0.16;
            audio.playShoot();

            if (currentAlienKey === 'xlr8' || currentAlienKey === 'cannonbolt') {
                player.specialDashTimer = isUltimate ? 1.15 : 0.85;
                player.invulnerableTimer = Math.max(player.invulnerableTimer, player.specialDashTimer);
                spawnFloatingText(player.x + 15, player.y - 15, `${cfg.specialName}!`, cfg.accentColor, 15);
            } else if (currentAlienKey === 'bigchill') {
                player.phaseTimer = isUltimate ? 1.5 : 1.1;
            }

            const projKind = currentAlienKey === 'jetray'
                ? 'neuro_laser'
                : (currentAlienKey === 'swampfire' ? (isUltimate ? 'blue_napalm' : 'methane_fire') : 'bio_missile');

            missiles.push({
                x: player.x + player.width - 6,
                y: player.y + player.height * 0.36,
                w: projKind === 'neuro_laser' ? 34 : 24,
                h: projKind === 'neuro_laser' ? 8 : 16,
                vx: 760,
                kind: projKind,
                color: isUltimate ? '#a3e635' : cfg.accentColor,
                pierce: isUltimate ? 2 : 1,
                trailTimer: 0
            });
            updateHUD();
        }

            const type = types[Math.floor(Math.random() * types.length)];

                const flyHeights = [groundY - 96, groundY - 68, groundY - 125];
                const by = flyHeights[Math.floor(Math.random() * flyHeights.length)];
                obstacles.push({
                    type,
                    x: canvas.width + 40,
                    y: by,
                    baseY: by,
                    w: 54,
                    h: 34,
                    frame: Math.random() * 6
                });
            } else if (type === 'knight_barrier') {
                obstacles.push({
                    type,
                    x: canvas.width + 40,
                    y: groundY - 70,
                    w: 36,
                    h: 70,
                    frame: 0
                });
            } else if (type === 'dnalien_pod') {
                obstacles.push({
                    type,
                    x: canvas.width + 40,
                    y: groundY - 46,
                    w: 52,
                    h: 46,
                    frame: 0
                });
            } else {
                const wide = Math.random() > 0.45;
                obstacles.push({
                    type: 'vilgax_spikes',
                    x: canvas.width + 40,
                    y: groundY - 44,
                    w: wide ? 64 : 44,
                    h: 44,
                    frame: 0
                });

        function spawnCollectible() {
            const isSmoothy = Math.random() < 0.24;
            const by = groundY - (62 + Math.random() * 75);
            collectibles.push({
                type: isSmoothy ? 'smoothy' : 'orb',
                x: canvas.width + 40,
                y: by,
                baseY: by,
                w: 30,
                h: 30,
                angle: Math.random() * Math.PI * 2
            });
        }

        function spawnExplosion(x, y, color = '#4ade80', count = 16) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const spd = 45 + Math.random() * 210;
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    size: 2.5 + Math.random() * 4,
                    color,
                    life: 0.25 + Math.random() * 0.28,
                    maxLife: 0.5
                });
            }
        }

        function spawnStompDust(x, y, count = 6) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x + (Math.random() - 0.5) * 24,
                    y: y - 2,
                    vx: -40 - Math.random() * 90,
                    vy: -15 - Math.random() * 55,
                    size: 2.5 + Math.random() * 3,
                    color: '#94a3b8',
                    life: 0.22 + Math.random() * 0.16,
                    maxLife: 0.38
                });
            }
        }

        function spawnFloatingText(x, y, text, color = '#4ade80', size = 15) {
            floatingTexts.push({
                x: Math.max(16, Math.min(canvas.width - 220, x)),
                y: Math.max(28, y),
                text,
                color,
                size,
                life: 0.95,
                maxLife: 0.95
            });

        /********************************************************************
         * 8. HUD UPDATER
         ********************************************************************/
        function updateHUD() {
            const cfg = ALIEN_ROSTER[currentAlienKey];
            const arena = getCurrentArena();
            score = Math.floor(distanceScore + bonusScore);
            scoreDisplay.textContent = String(score).padStart(5, '0');
            if (score > highScore) {
                highScore = score;
                highScoreDisplay.textContent = String(highScore).padStart(5, '0');
            }
            if (speedDisplay) speedDisplay.textContent = (speedMultiplier * cfg.speedFactor).toFixed(1) + 'x';
            if (levelDisplay) levelDisplay.textContent = String(currentLevel);
            if (levelBadgeTag) levelBadgeTag.textContent = `LVL ${currentLevel}`;
            if (arenaBadgeTag) arenaBadgeTag.textContent = arena.name;

            if (passiveTraitTag) {
                passiveTraitTag.textContent = currentAlienKey === 'upchuck'
                    ? `BELLY: ${upchuckSwallowedCount} SWALLOWED`
                    : cfg.passiveLabel;
            }

            // Update 10-Alien Roster Cards (Unlock states & Active state)
            document.querySelectorAll('.alien-card').forEach(btn => {
                const key = btn.dataset.alien;
                const aCfg = ALIEN_ROSTER[key];
                const unlocked = isAlienUnlocked(key);
                const statusEl = document.getElementById(`status-${key}`);

                if (unlocked) {
                    btn.classList.remove('locked');
                    if (statusEl && aCfg) statusEl.textContent = aCfg.shortDesc;
                } else {
                    btn.classList.add('locked');
                    if (statusEl && aCfg) {
                        statusEl.textContent = aCfg.isSecret ? "Code: RRR" : `Lvl ${aCfg.unlockLevel}`;
                    }
                }

                if (key === currentAlienKey) {
                    if (!btn.classList.contains('active')) {
                        btn.classList.add('active');
                        try {
                            btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                        } catch (e) {}
                    }
                } else {
                    btn.classList.remove('active');
                }
            });

            const btnJumpTitle = document.getElementById('btnJumpTitle');
            const btnDuckTitle = document.getElementById('btnDuckTitle');
            const btnShootSub = document.getElementById('btnShootSub');

            if (btnJumpTitle) {
                btnJumpTitle.textContent = currentAlienKey === 'jetray' ? 'JUMP / GLIDE' : (cfg.maxJumps === 3 ? 'JUMP / 3X' : 'JUMP / 2X');
            }
            if (btnDuckTitle) {
                btnDuckTitle.textContent = currentAlienKey === 'cannonbolt' ? 'SPHERE ROLL' : (currentAlienKey === 'bigchill' ? 'CRYO-PHASE' : 'CROUCH / SLAM');
            }
            if (btnShootSub) {
                btnShootSub.textContent = currentAlienKey === 'upchuck' ? `TONGUE/SPIT (${upchuckSwallowedCount})` : cfg.specialName;
            }

            if (player.hasShield) {
                shieldBadge.classList.remove('hidden');
            } else {
                shieldBadge.classList.add('hidden');
            }

            // Progress within current level
            const levelProgressPct = Math.min(100, Math.floor(((score % POINTS_PER_LEVEL) / POINTS_PER_LEVEL) * 100));

            if (isUltimate) {
                hudHeader.classList.add('ultimatrix-active-panel');
                ultimatrixSpikes.classList.remove('opacity-0');
                if (dnaStatusTag) {
                    dnaStatusTag.textContent = cfg.ultimateSpecies;
                    dnaStatusTag.className = 'text-[10px] font-orbitron tracking-widest uppercase px-2 py-0.5 rounded bg-lime-400/20 text-lime-300 border border-lime-400/60';
                }
                formTitle.textContent = cfg.ultimateName;
                formTitle.className = 'font-orbitron font-black text-xs sm:text-base tracking-wider text-lime-300 drop-shadow-[0_0_12px_rgba(74,222,128,0.8)]';

                gaugeLabel.textContent = `LVL ${currentLevel} • ULTIMATE`;
                gaugeValueText.textContent = `${levelProgressPct}%`;
                evolutionBar.style.width = `${levelProgressPct}%`;
            } else {
                hudHeader.classList.remove('ultimatrix-active-panel');
                ultimatrixSpikes.classList.add('opacity-0');
                if (dnaStatusTag) {
                    dnaStatusTag.textContent = cfg.species;
                    dnaStatusTag.className = 'text-[10px] font-orbitron tracking-widest uppercase px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/40';
                }
                formTitle.textContent = cfg.name;
                formTitle.className = 'font-orbitron font-black text-xs sm:text-base tracking-wider text-white drop-shadow-[0_0_8px_rgba(34,197,94,0.5)]';

                let nextReward = `LVL ${currentLevel + 1}`;
                if (currentLevel === 1) nextReward = 'JETRAY @ L2';
                else if (currentLevel === 2) nextReward = 'BIG CHILL @ L3';
                else if (currentLevel === 3) nextReward = 'SWAMPFIRE @ L4';
                else if (currentLevel === 4) nextReward = 'HUMUNGOUSAUR @ L5';
                else if (currentLevel === 5) nextReward = 'CANNONBOLT @ L6';
                else if (currentLevel === 6) nextReward = 'ULTIMATES @ L7';
                else if (currentLevel < 10) nextReward = 'GREY MATTER @ L10';
                else if (currentLevel < 15) nextReward = 'FOUR ARMS @ L15';
                else if (currentLevel < 20) nextReward = 'WAY BIG @ L20';

                gaugeLabel.textContent = `LVL ${currentLevel} (${nextReward})`;
                gaugeValueText.textContent = `${levelProgressPct}%`;
                evolutionBar.style.width = `${levelProgressPct}%`;
            }

            specialAbilityLabel.innerHTML = `${cfg.specialName}:`;
            let pipsHTML = '';
            for (let i = 0; i < MAX_MISSILES; i++) {
                if (i < missileAmmo) {
                    pipsHTML += `<span class="w-4 h-2 rounded-sm bg-cyan-400 shadow-[0_0_8px_#22d3ee] border border-white/60 inline-block"></span>`;
                } else {
                    pipsHTML += `<span class="w-4 h-2 rounded-sm bg-slate-800 border border-slate-600 inline-block"></span>`;
                }
            }
            ammoPips.innerHTML = pipsHTML;
        }

        /********************************************************************
         * 9. GAME LOOP UPDATE (PHYSICS, COLLISIONS, LEVEL PROGRESSION)
         ********************************************************************/
        function handleLevelUp(newLevel) {
            currentLevel = newLevel;
            if (currentLevel > maxUnlockedLevel) {
                maxUnlockedLevel = currentLevel;
                try { localStorage.setItem('ben10_max_level', String(maxUnlockedLevel)); } catch (e) {}
            }

            const arena = getCurrentArena();
            evolutionFlashTimer = 0.75;
            screenShake = 9;
            player.invulnerableTimer = Math.max(player.invulnerableTimer, 1.1);
            missileAmmo = MAX_MISSILES;

            // Check if a new alien unlocks on this exact level!
            const unlockedHere = Object.values(ALIEN_ROSTER).find(a => a.unlockLevel === currentLevel && !a.isSecret);

            if (unlockedHere) {
                // Automatically transform into the newly unlocked level alien!
                selectAlien(unlockedHere.id, true);
                spawnFloatingText(
                    player.x + 10,
                    Math.max(38, player.y - 28),
                    `LVL ${currentLevel}: ${unlockedHere.name} UNLOCKED! (${arena.name})`,
                    unlockedHere.accentColor,
                    16
                );
            } else if (currentLevel === 7) {
                // After Level 6 -> Unlock Ultimate Evolution forms!
                triggerUltimateEvolution(true);
                spawnFloatingText(
                    player.x + 10,
                    Math.max(38, player.y - 28),
                    `LVL 7: ULTIMATE FORMS UNLOCKED! (${arena.name})`,
                    "#a3e635",
                    17
                );
            } else if (currentLevel % 5 === 0) {
                audio.playEvolution();
                spawnFloatingText(
                    player.x + 10,
                    Math.max(38, player.y - 28),
                    `LVL ${currentLevel} MILESTONE CLEARED! ARENA: ${arena.name}`,
                    "#38bdf8",
                    16
                );
            } else {
                audio.playOmnitrixDialSwap();
                spawnFloatingText(
                    player.x + 15,
                    Math.max(38, player.y - 24),
                    `LEVEL ${currentLevel} — ${arena.name}!`,
                    "#4ade80",
                    16
                );
            }

            updateHUD();
        }

        function startGame() {
            audio.init();
            audio.startMusic();
            if (audio.selectedTrackMode === 'custom' && audio.customAudio && audio.musicEnabled) {
                audio.customAudio.play().catch(() => {});
            }

            gameState = 'PLAYING';
            score = 0;
            bonusScore = 0;
            distanceScore = 0;
            currentLevel = 1;
            evolutionProgress = 0;
            isUltimate = false;
            nextOverdriveMilestone = 1000;
            activeTongueGrab = null;
            upchuckSwallowedCount = currentAlienKey === 'upchuck' ? 2 : 0;
            audio.syncAutoForm(false);

            // Start Level 1 with XLR8 (unless player specifically unlocked & selected Upchuck via 'RRR')
            if (currentAlienKey !== 'upchuck') {
                currentAlienKey = 'xlr8';
            }

            baseSpeed = 425;
            currentSpeed = baseSpeed;
            speedMultiplier = 1.0;
            audio.tempoMultiplier = 1.0;

            obstacles = [];
            collectibles = [];
            missiles = [];
            shockwaves = [];
            particles = [];
            floatingTexts = [];

            missileAmmo = MAX_MISSILES;
            missileRechargeTimer = 0;

            const cfg = ALIEN_ROSTER[currentAlienKey];
            player.normalHeight = cfg.normalHeight;
            player.duckHeight = cfg.duckHeight;
            player.width = cfg.width;
            player.height = player.normalHeight;
            player.maxJumps = cfg.maxJumps;
            player.y = groundY - player.height;
            player.vy = 0;
            player.isGrounded = true;
            player.isDucking = false;
            player.isSlamming = false;
            player.hasShield = false;
            player.invulnerableTimer = 0;
            player.specialDashTimer = 0;
            player.phaseTimer = 0;

            overlayModal.classList.add('opacity-0', 'pointer-events-none');
            updateHUD();
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            audio.playGameOver();
            screenShake = 16;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('ben10_humungousaur_highscore', String(highScore));
            }

            const cfg = ALIEN_ROSTER[currentAlienKey];
            modalTitle.textContent = 'OMNITRIX TIMED OUT!';
            modalSubtitle.innerHTML = `${isUltimate ? cfg.ultimateName : cfg.name} took a heavy hit from Vilgax forces! Pick any alien from the Omnitrix bar or press <span class="text-emerald-400 font-bold">SPACE</span> to jump back in!`;
            gameOverStats.classList.remove('hidden');
            gameOverStats.classList.add('grid');
            finalScoreText.textContent = score;
            bestScoreText.textContent = highScore;
            startBtn.textContent = 'RECHARGE OMNITRIX [SPACE]';

            overlayModal.classList.remove('opacity-0', 'pointer-events-none');
            updateHUD();
        }

        function updateGame(dt) {
            if (gameState !== 'PLAYING') return;

            const cfg = ALIEN_ROSTER[currentAlienKey];

            // 1. Speed, Score & Level Progression
            const dashBoost = player.specialDashTimer > 0 ? 1.38 : 1.0;
            speedMultiplier = 1.0 + Math.min(2.3, (distanceScore + bonusScore) / 1450);
            currentSpeed = baseSpeed * speedMultiplier * cfg.speedFactor * dashBoost;
            distanceScore += (currentSpeed * dt) * 0.044;
            audio.tempoMultiplier = speedMultiplier;

            const totalPoints = Math.floor(distanceScore + bonusScore);
            const targetLevel = 1 + Math.floor(totalPoints / POINTS_PER_LEVEL);
            if (targetLevel > currentLevel) {
                handleLevelUp(targetLevel);
            }

            // 2. Ultimate Overdrive Milestones (Level 7+ unlocks Ultimate Forms!)
            if (currentLevel >= 7 && !isUltimate && evolutionProgress < 100) {
                evolutionProgress = 100;
                triggerUltimateEvolution(true);
            } else if (isUltimate) {
                if (totalPoints >= nextOverdriveMilestone) {
                    nextOverdriveMilestone += 1000;
                    missileAmmo = MAX_MISSILES;
                    evolutionFlashTimer = 0.65;
                    screenShake = 10;
                    audio.playEvolution();
                    spawnFloatingText(player.x + 30, player.y - 25, "ULTIMATE OVERDRIVE SHOCKWAVE!", "#a3e635", 17);
                }
            }

            // Upchuck Tongue Animation Timer
            if (activeTongueGrab) {
                activeTongueGrab.timer -= dt;
                if (activeTongueGrab.timer <= 0) {
                    activeTongueGrab = null;
                }
            }

            // Recharge Special Energy Pips
            if (missileAmmo < MAX_MISSILES) {
                const rechargeRate = isUltimate ? 1.35 : 1.0;
                missileRechargeTimer += dt * rechargeRate;
                if (missileRechargeTimer >= MISSILE_COOLDOWN) {
                    missileRechargeTimer = 0;
                    missileAmmo++;
                }
            }

            // Timers
            if (evolutionFlashTimer > 0) evolutionFlashTimer = Math.max(0, evolutionFlashTimer - dt);
            if (shootRecoilTimer > 0) shootRecoilTimer = Math.max(0, shootRecoilTimer - dt);
            if (player.invulnerableTimer > 0) player.invulnerableTimer = Math.max(0, player.invulnerableTimer - dt);
            if (player.specialDashTimer > 0) player.specialDashTimer = Math.max(0, player.specialDashTimer - dt);
            if (player.phaseTimer > 0) player.phaseTimer = Math.max(0, player.phaseTimer - dt);
            if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 28);

            // 3. Player Physics & Jetray Supersonic Wing Glide
            let effectiveGravity = 1750 * cfg.gravityScale;
            if (currentAlienKey === 'jetray' && !player.isGrounded && jumpKeyHeld && player.vy > 0) {
                effectiveGravity *= 0.22; // Smooth manta-ray air hover!
                if (Math.random() < 0.45) {
                    particles.push({
                        x: player.x + 10,
                        y: player.y + player.height * 0.6,
                        vx: -currentSpeed * 0.6,
                        vy: (Math.random() - 0.5) * 30,
                        size: 3.5,
                        color: isUltimate ? '#22d3ee' : '#facc15',
                        life: 0.25,
                        maxLife: 0.25
                    });
                }
            }

            player.vy += effectiveGravity * dt;
            player.y += player.vy * dt;

            if (player.y + player.height >= groundY) {
                if (!player.isGrounded) {
                    if (player.isSlamming) {
                        triggerGroundSlamImpact();
                        player.isSlamming = false;
                    } else if (player.vy > 450) {
                        spawnStompDust(player.x + player.width / 2, groundY, 10);
                        audio.playStomp(currentAlienKey === 'humungousaur' || currentAlienKey === 'cannonbolt');
                    }
                }
                player.y = groundY - player.height;
                player.vy = 0;
                player.isGrounded = true;
                player.jumpCount = 0;
            }

            // Running / Rolling / Gliding animation
            player.rollAngle += dt * (16 * speedMultiplier * cfg.speedFactor);
            if (player.isGrounded) {
                player.legAngle += dt * (11 * speedMultiplier * cfg.speedFactor);
                stepSoundTimer -= dt;
                if (stepSoundTimer <= 0) {
                    stepSoundTimer = Math.max(0.14, 0.34 / (speedMultiplier * cfg.speedFactor));
                    if (currentAlienKey !== 'jetray' && currentAlienKey !== 'bigchill') {
                        audio.playStomp(currentAlienKey === 'humungousaur' || isUltimate);
                    }
                    spawnStompDust(player.x + 25, groundY, 3);
                }
            } else {
                player.legAngle += dt * 4;
            }

            // 4. Parallax Background Update
            bgStars.forEach(s => {
                s.x -= s.speed * dt * (isUltimate ? 2.2 : 1);
                if (s.x < 0) s.x = canvas.width;
            });
            bgBuildings.forEach(b => {
                b.x -= currentSpeed * 0.22 * dt;
            });
            if (bgBuildings.length && bgBuildings[0].x + bgBuildings[0].w < -50) {
                const first = bgBuildings.shift();
                const last = bgBuildings[bgBuildings.length - 1];
                first.x = last.x + last.w + 20 + Math.random() * 35;
                bgBuildings.push(first);
            }

            // 5. Spawn Obstacles & Collectibles
            obstacleTimer -= dt;
            if (obstacleTimer <= 0) {
                spawnObstacle();
                const minGap = Math.max(0.60, 1.35 - speedMultiplier * 0.25);
                const maxGap = Math.max(1.05, 2.02 - speedMultiplier * 0.28);
                obstacleTimer = minGap + Math.random() * (maxGap - minGap);
            }

            collectibleTimer -= dt;
            if (collectibleTimer <= 0) {
                spawnCollectible();
                collectibleTimer = 2.4 + Math.random() * 2.1;
            }

            // 6. Update Alien Projectiles (Missiles, Neuro-Lasers, Fireballs, Cryo-Beams, Tornadoes)
            for (let i = missiles.length - 1; i >= 0; i--) {
                const m = missiles[i];
                m.x += m.vx * dt;
                m.trailTimer += dt;
                if (m.trailTimer > 0.022) {
                    m.trailTimer = 0;
                    particles.push({
                        x: m.x,
                        y: m.y + m.h / 2,
                        vx: -90,
                        vy: (Math.random() - 0.5) * 45,
                        size: 4,
                        color: m.color || '#4ade80',
                        life: 0.2,
                        maxLife: 0.2
                    });
                }

                for (let j = obstacles.length - 1; j >= 0; j--) {
                    const obs = obstacles[j];
                    if (rectIntersect(m.x, m.y, m.w, m.h, obs.x, obs.y, obs.w, obs.h)) {
                        audio.playExplosion();
                        screenShake = 7;
                        bonusScore += 30;
                        spawnExplosion(obs.x + obs.w / 2, obs.y + obs.h / 2, m.color || '#22c55e', 20);
                        spawnFloatingText(obs.x, obs.y - 10, "ALIEN BLAST +30!", m.color || "#4ade80", 15);
                        obstacles.splice(j, 1);
                        m.pierce = (m.pierce || 1) - 1;
                        if (m.pierce <= 0) break;
                    }
                }

                if ((m.pierce !== undefined && m.pierce <= 0) || m.x > canvas.width + 80) {
                    missiles.splice(i, 1);
                }
            }

            // 7. Update Collectibles
            const pBox = getPlayerHitbox();
            for (let i = collectibles.length - 1; i >= 0; i--) {
                const c = collectibles[i];
                c.x -= currentSpeed * dt;
                c.angle += dt * 4;
                c.y = c.baseY + Math.sin(c.angle) * 6;

                if (rectIntersect(pBox.x, pBox.y, pBox.w, pBox.h, c.x, c.y, c.w, c.h)) {
                    audio.playPickup();
                    totalOrbs++;
                    try { localStorage.setItem('ben10_total_orbs', String(totalOrbs)); } catch (e) {}
                    if (orbsDisplay) orbsDisplay.textContent = String(totalOrbs);

                    if (c.type === 'smoothy') {
                        bonusScore += 50;
                        player.hasShield = true;
                        missileAmmo = MAX_MISSILES;
                        spawnExplosion(c.x + 16, c.y + 16, '#38bdf8', 14);
                        spawnFloatingText(c.x, c.y - 12, "MR. SMOOTHY SHIELD +50!", "#38bdf8", 15);
                    } else {
                        bonusScore += 35;
                        if (missileAmmo < MAX_MISSILES) missileAmmo++;
                        spawnFloatingText(c.x, c.y - 12, "OMNITRIX ORB +35!", "#4ade80", 14);
                        spawnExplosion(c.x + 16, c.y + 16, '#22c55e', 12);
                    }
                    collectibles.splice(i, 1);
                    continue;
                }

                if (c.x + c.w < -40) {
                    collectibles.splice(i, 1);
                }
            }

            // 8. Update Obstacles & Check Player Collisions
            const isCannonboltRolling = currentAlienKey === 'cannonbolt' && (player.isDucking || player.specialDashTimer > 0);
            const isPhasing = currentAlienKey === 'bigchill' && (player.isDucking || player.phaseTimer > 0);
            // XLR8 Tornado Blitz slows incoming obstacles slightly for time-dilation feel
            const timeDilation = (currentAlienKey === 'xlr8' && player.specialDashTimer > 0) ? 0.65 : 1.0;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                const speedFactor = obs.type === 'vilgax_drone' ? 1.12 : 1.0;
                obs.x -= currentSpeed * speedFactor * timeDilation * dt;
                obs.frame += dt * 6;
                if (obs.type === 'vilgax_drone') {
                    obs.y = obs.baseY + Math.sin(obs.frame) * 5;
                }

                if (rectIntersect(pBox.x, pBox.y, pBox.w, pBox.h, obs.x + 4, obs.y + 4, obs.w - 8, obs.h - 8)) {
                    if (currentAlienKey === 'upchuck' && (player.isDucking || upchuckSwallowedCount < 3)) {
                        // Upchuck can automatically tongue-gulp an obstacle on contact when crouching or hungry!
                        audio.playTongueGrab();
                        upchuckSwallowedCount = Math.min(3, upchuckSwallowedCount + 1);
                        player.invulnerableTimer = 0.45;
                        bonusScore += 35;
                        spawnExplosion(obs.x + obs.w / 2, obs.y + obs.h / 2, '#a3e635', 16);
                        spawnFloatingText(obs.x, obs.y - 12, `CHOMPED +35! (PRESS X TO SPIT)`, "#a3e635", 14);
                        obstacles.splice(i, 1);
                        continue;
                    } else if (isPhasing) {
                        // Big Chill passes harmlessly through obstacles while phasing!
                        if (!obs.phasedBonus) {
                            obs.phasedBonus = true;
                            bonusScore += 20;
                            spawnFloatingText(obs.x, obs.y - 12, "CRYO-PHASED +20!", "#38bdf8", 14);
                        }
                        continue;
                    } else if (isCannonboltRolling || player.specialDashTimer > 0 || player.invulnerableTimer > 0) {
                        audio.playExplosion();
                        screenShake = 9;
                        bonusScore += 35;
                        spawnExplosion(obs.x + obs.w / 2, obs.y + obs.h / 2, cfg.accentColor, 20);
                        spawnFloatingText(obs.x, obs.y - 12, "SMASHED +35!", cfg.accentColor, 15);
                        obstacles.splice(i, 1);
                        continue;
                    } else if (player.hasShield) {
                        player.hasShield = false;
                        player.invulnerableTimer = 0.85;
                        audio.playExplosion();
                        screenShake = 10;
                        spawnExplosion(obs.x + obs.w / 2, obs.y + obs.h / 2, '#38bdf8', 20);
                        spawnFloatingText(player.x + 20, player.y - 15, "SHIELD ABSORBED HIT!", "#38bdf8", 16);
                        obstacles.splice(i, 1);
                        continue;
                    } else {
                        triggerGameOver();
                        return;
                    }
                }

                if (obs.x + obs.w < -60) {
                    obstacles.splice(i, 1);
                }
            }

            // 9. Update Shockwaves, Particles & Floating Texts
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                sw.r += 520 * dt;
                sw.alpha = Math.max(0, 1 - sw.r / sw.maxR);
                if (sw.r >= sw.maxR) shockwaves.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt;
                if (p.life <= 0) particles.splice(i, 1);
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y -= 42 * dt;
                ft.life -= dt;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }

            updateHUD();
        }

        function getPlayerHitbox() {
            return {
                x: player.x + 14,
                y: player.y + 8,
                w: player.width - 26,
                h: player.height - 14
            };
        }

        function rectIntersect(x1, y1, w1, h1, x2, y2, w2, h2) {
            return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
        }

        /********************************************************************
         * 10. CUSTOM CANVAS 2D VECTOR ART RENDERING (MULTI-ARENA EDITION)
         ********************************************************************/
        function drawGame() {
            ctx.save();

            if (screenShake > 0) {
                const sx = (Math.random() - 0.5) * screenShake;
                const sy = (Math.random() - 0.5) * screenShake;
                ctx.translate(sx, sy);
            }

            const arena = getCurrentArena();

            // 1. Dynamic Ben 10 Universe Arena Sky Background
            const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
            skyGrad.addColorStop(0, arena.skyTop);
            skyGrad.addColorStop(0.6, arena.skyMid);
            skyGrad.addColorStop(1, arena.skyBot);
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Arena Stars / Dimensional Portals / Planets
            ctx.fillStyle = arena.starColor;
            bgStars.forEach(s => {
                ctx.globalAlpha = s.alpha;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            const moonX = canvas.width * 0.82;
            const moonY = 62;
            ctx.save();
            ctx.fillStyle = arena.planetColor;
            ctx.globalAlpha = 0.22;
            ctx.beginPath();
            ctx.arc(moonX, moonY, 42, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 0.38;
            ctx.beginPath();
            ctx.arc(moonX, moonY, 26, 0, Math.PI * 2);
            ctx.fill();

            // Planetary Ring / Null Void Vortex Ring
            if (arena.id === 'space' || arena.id === 'nullvoid' || arena.id === 'vilgax') {
                ctx.strokeStyle = arena.groundLine;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.ellipse(moonX, moonY, 58, 14, -0.25, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();

            // 3. Arena Parallax Structures (Space Stations, Null Void Rocks, Forever Knight Castles, Vilgax Dreadnoughts)
            bgBuildings.forEach(b => {
                ctx.fillStyle = arena.bldgFill;
                ctx.strokeStyle = arena.bldgStroke;
                ctx.lineWidth = 1.5;

                if (arena.id === 'nullvoid') {
                    // Floating Null Void jagged prison rocks
                    const floatY = groundY - b.h - 25;
                    ctx.beginPath();
                    ctx.moveTo(b.x, floatY + b.h * 0.4);
                    ctx.lineTo(b.x + b.w * 0.5, floatY);
                    ctx.lineTo(b.x + b.w, floatY + b.h * 0.45);
                    ctx.lineTo(b.x + b.w * 0.75, floatY + b.h * 0.8);
                    ctx.lineTo(b.x + b.w * 0.2, floatY + b.h * 0.75);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else if (arena.id === 'foreverknights') {
                    // Gothic Castle Battlements
                    ctx.fillRect(b.x, groundY - b.h, b.w, b.h);
                    ctx.strokeRect(b.x, groundY - b.h, b.w, b.h);
                    for (let cx = b.x; cx < b.x + b.w - 8; cx += 14) {
                        ctx.fillRect(cx, groundY - b.h - 8, 8, 8);
                    }
                } else {
                    ctx.fillRect(b.x, groundY - b.h, b.w, b.h);
                    ctx.strokeRect(b.x, groundY - b.h, b.w, b.h);
                    ctx.fillStyle = arena.windowColor;
                    for (let wy = groundY - b.h + 14; wy < groundY - 18; wy += 18) {
                        ctx.fillRect(b.x + 10, wy, b.w - 20, 6);
                    }
                }
            });

            // 4. Arena Ground Track
            ctx.fillStyle = arena.groundFill;
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            ctx.strokeStyle = arena.groundLine;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();

            const tickOffset = (distanceScore * 22) % 60;
            ctx.strokeStyle = arena.bldgStroke;
            ctx.lineWidth = 2;
            for (let gx = -tickOffset; gx < canvas.width; gx += 60) {
                ctx.beginPath();
                ctx.moveTo(gx, groundY + 12);
                ctx.lineTo(gx - 24, canvas.height);
                ctx.stroke();
            }

            // 5. Draw Collectibles
            collectibles.forEach(c => drawCollectible(c));

            // 6. Draw Obstacles
            obstacles.forEach(obs => drawObstacle(obs));

            // 7. Draw Upchuck's 4 Stretchy Gourmand Tongues Grabbing Obstacles!
            if (activeTongueGrab) {
                const mouthX = player.x + player.width - 6;
                const mouthY = player.y + 24;
                const prog = activeTongueGrab.timer / activeTongueGrab.maxTimer;
                const curX = mouthX + (activeTongueGrab.targetX - mouthX) * prog;
                const curY = mouthY + (activeTongueGrab.targetY - mouthY) * prog;

                ctx.save();
                for (let t = -1.5; t <= 1.5; t += 1) {
                    ctx.strokeStyle = t % 2 === 0 ? '#a3e635' : '#4ade80';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(mouthX, mouthY + t * 3);
                    ctx.quadraticCurveTo(
                        (mouthX + curX) / 2,
                        mouthY - 18 + t * 10,
                        curX,
                        curY + t * 5
                    );
                    ctx.stroke();
                }
                // Shrinking captured obstacle being pulled into Upchuck's mouth
                ctx.fillStyle = '#a3e635';
                ctx.beginPath();
                ctx.arc(curX, curY, 14 * prog + 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // 8. Draw Projectiles
            missiles.forEach(m => drawProjectile(m));

            // 8. Draw Seismic Ground Slam Shockwaves
            shockwaves.forEach(sw => {
                ctx.save();
                ctx.globalAlpha = sw.alpha;
                ctx.strokeStyle = sw.color;
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.arc(sw.x, sw.y, sw.r, Math.PI, 0);
                ctx.stroke();
                ctx.restore();
            });

            // 9. Draw Active Ben 10 Alien
            drawActiveAlien(player);

            // 10. Draw Particles & Floating Texts
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
                ctx.font = `900 ${ft.size}px 'Orbitron', sans-serif`;
                ctx.fillStyle = ft.color;
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 6;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            });

            // 11. Dramatic Omnitrix / Ultimatrix Transformation Flash Overlay
            if (evolutionFlashTimer > 0) {
                ctx.save();
                ctx.fillStyle = `rgba(34, 197, 94, ${evolutionFlashTimer * 0.42})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const cx = player.x + player.width / 2;
                const cy = player.y + player.height / 2;
                const radius = (1.1 - evolutionFlashTimer) * 260 + 20;
                ctx.strokeStyle = `rgba(163, 230, 53, ${evolutionFlashTimer})`;
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            ctx.restore();
        }

        /********************************************************************
         * 11. 6-ALIEN VECTOR SPRITE RENDERERS (BASE & ULTIMATE FORMS)
         ********************************************************************/
        function drawActiveAlien(p) {
            ctx.save();

            // Smoothy Shield Aura
            if (p.hasShield) {
                ctx.save();
                ctx.strokeStyle = '#38bdf8';
                ctx.fillStyle = 'rgba(56, 189, 248, 0.14)';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(p.x + p.width / 2, p.y + p.height / 2, Math.max(p.width, p.height) * 0.65, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            if (currentAlienKey === 'humungousaur') {
                if (isUltimate) drawUltimateHumungousaur(p);
                else drawBaseHumungousaur(p);
            } else if (currentAlienKey === 'jetray') {
                drawJetray(p, isUltimate);
            } else if (currentAlienKey === 'cannonbolt') {
                drawCannonbolt(p, isUltimate);
            } else if (currentAlienKey === 'xlr8') {
                drawXLR8(p, isUltimate);
            } else if (currentAlienKey === 'swampfire') {
                drawSwampfire(p, isUltimate);
            } else if (currentAlienKey === 'bigchill') {
                drawBigChill(p, isUltimate);
            } else if (currentAlienKey === 'greymatter') {
                drawGreyMatter(p, isUltimate);
            } else if (currentAlienKey === 'fourarms') {
                drawFourArms(p, isUltimate);
            } else if (currentAlienKey === 'waybig') {
                drawWayBig(p, isUltimate);
            } else if (currentAlienKey === 'upchuck') {
                drawUpchuck(p, isUltimate);
            }

            ctx.restore();
        }

        function drawOmnitrixSymbol(cx, cy, r, ultimateSpikes = false) {
            ctx.save();
            if (ultimateSpikes) {
                ctx.fillStyle = '#cbd5e1';
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 1.5;
                const angles = [-Math.PI * 0.75, -Math.PI * 0.25, Math.PI * 0.25, Math.PI * 0.75];
                angles.forEach(a => {
                    ctx.beginPath();
                    ctx.moveTo(cx + Math.cos(a) * (r + 7), cy + Math.sin(a) * (r + 7));
                    ctx.lineTo(cx + Math.cos(a - 0.3) * (r - 2), cy + Math.sin(a - 0.3) * (r - 2));
                    ctx.lineTo(cx + Math.cos(a + 0.3) * (r - 2), cy + Math.sin(a + 0.3) * (r - 2));
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                });
            }

            ctx.fillStyle = '#111827';
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.arc(cx, cy, r - 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#090d16';
            ctx.beginPath();
            ctx.moveTo(cx - r + 2, cy - r * 0.6);
            ctx.lineTo(cx - 1.5, cy);
            ctx.lineTo(cx - r + 2, cy + r * 0.6);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(cx + r - 2, cy - r * 0.6);
            ctx.lineTo(cx + 1.5, cy);
            ctx.lineTo(cx + r - 2, cy + r * 0.6);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        // [1] HUMUNGOUSAUR & ULTIMATE HUMUNGOUSAUR
        function drawBaseHumungousaur(p) {
            ctx.save();
            const x = p.x;
            const y = p.y;
            const legSwing = Math.sin(p.legAngle) * 12;
            const bounce = p.isGrounded ? Math.abs(Math.cos(p.legAngle)) * 3 : 0;
            ctx.translate(0, -bounce);

            ctx.fillStyle = '#8B5A2B';
            ctx.strokeStyle = '#4A2E14';
            ctx.lineWidth = 2;
            ctx.beginPath();
            const tailY = p.isDucking ? y + 28 : y + 54;
            ctx.moveTo(x + 16, tailY);
            ctx.quadraticCurveTo(x - 24, tailY + 6 + Math.sin(p.legAngle) * 6, x - 44, tailY - 8 + Math.sin(p.legAngle) * 10);
            ctx.quadraticCurveTo(x - 18, tailY + 20, x + 20, tailY + 18);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#704621';
            drawRoundedRect(ctx, x + 18 - legSwing * 0.6, y + p.height - 26, 20, 26, 5);
            ctx.fill();

            if (p.isDucking) {
                ctx.fillStyle = '#5C3818';
                for (let i = 0; i < 4; i++) {
                    ctx.beginPath();
                    ctx.moveTo(x + 12 + i * 13, y + 8);
                    ctx.lineTo(x + 18 + i * 13, y - 4);
                    ctx.lineTo(x + 24 + i * 13, y + 8);
                    ctx.fill();
                }
                ctx.fillStyle = '#9C6635';
                ctx.strokeStyle = '#4A2E14';
                ctx.lineWidth = 2.5;
                drawRoundedRect(ctx, x + 8, y + 6, 56, 34, 12);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#9C6635';
                drawRoundedRect(ctx, x + 52, y + 8, 28, 24, 7);
                ctx.fill();
                ctx.stroke();
                drawOmnitrixSymbol(x + 44, y + 22, 8, false);
            } else {
                ctx.fillStyle = '#5C3818';
                for (let i = 0; i < 4; i++) {
                    ctx.beginPath();
                    ctx.moveTo(x + 8, y + 20 + i * 11);
                    ctx.lineTo(x - 2, y + 25 + i * 11);
                    ctx.lineTo(x + 8, y + 30 + i * 11);
                    ctx.fill();
                }

                ctx.fillStyle = '#9C6635';
                ctx.strokeStyle = '#4A2E14';
                ctx.lineWidth = 2.5;
                drawRoundedRect(ctx, x + 10, y + 22, 48, 48, 12);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#D2A679';
                drawRoundedRect(ctx, x + 28, y + 28, 26, 36, 8);
                ctx.fill();

                ctx.fillStyle = '#9C6635';
                drawRoundedRect(ctx, x + 26, y + 2, 34, 24, 7);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#4ade80';
                ctx.beginPath();
                ctx.arc(x + 49, y + 11, 3.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#e2e8f0';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(x + 22, y + 24);
                ctx.lineTo(x + 52, y + 56);
                ctx.stroke();

                drawOmnitrixSymbol(x + 42, y + 38, 8.5, false);

                ctx.fillStyle = '#8B5A2B';
                drawRoundedRect(ctx, x + 26 + legSwing * 0.4, y + 34, 26, 14, 6);
                ctx.fill();
                ctx.stroke();
            }

            ctx.fillStyle = '#9C6635';
            ctx.strokeStyle = '#4A2E14';
            ctx.lineWidth = 2;
            drawRoundedRect(ctx, x + 32 + legSwing * 0.65, y + p.height - 26, 22, 26, 5);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        function drawUltimateHumungousaur(p) {
            ctx.save();
            const x = p.x;
            const y = p.y;
            const legSwing = Math.sin(p.legAngle) * 13;
            const bounce = p.isGrounded ? Math.abs(Math.cos(p.legAngle)) * 3.5 : 0;
            ctx.translate(0, -bounce);

            const tailY = p.isDucking ? y + 28 : y + 56;
            const tailSwing = Math.sin(p.legAngle) * 8;
            ctx.fillStyle = '#2E7D32';
            ctx.strokeStyle = '#052e16';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(x + 14, tailY);
            ctx.quadraticCurveTo(x - 22, tailY + 4 + tailSwing, x - 46, tailY - 10 + tailSwing);
            ctx.quadraticCurveTo(x - 20, tailY + 20, x + 18, tailY + 18);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#334155';
            ctx.strokeStyle = '#94a3b8';
            ctx.beginPath();
            ctx.arc(x - 46, tailY - 8 + tailSwing, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#1B5E20';
            drawRoundedRect(ctx, x + 16 - legSwing * 0.6, y + p.height - 28, 22, 28, 5);
            ctx.fill();

            if (p.isDucking) {
                ctx.fillStyle = '#1E3A8A';
                ctx.strokeStyle = '#60A5FA';
                ctx.lineWidth = 2.5;
                drawRoundedRect(ctx, x + 6, y + 4, 68, 38, 16);
                ctx.fill();
                ctx.stroke();
                drawOmnitrixSymbol(x + 42, y + 24, 9, true);
            } else {
                ctx.fillStyle = '#1E3A8A';
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 2.5;
                drawRoundedRect(ctx, x + 2, y + 18, 32, 52, 12);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#2E7D32';
                ctx.strokeStyle = '#052e16';
                drawRoundedRect(ctx, x + 14, y + 20, 52, 52, 12);
                ctx.fill();
                ctx.stroke();

                drawOmnitrixSymbol(x + 45, y + 40, 9.5, true);

                ctx.fillStyle = '#2E7D32';
                drawRoundedRect(ctx, x + 28, y + 2, 38, 24, 6);
                ctx.fill();

                ctx.fillStyle = '#1E3A8A';
                ctx.beginPath();
                ctx.moveTo(x + 26, y + 12);
                ctx.lineTo(x + 30, y - 4);
                ctx.lineTo(x + 66, y + 2);
                ctx.lineTo(x + 66, y + 12);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#a3e635';
                ctx.beginPath();
                ctx.arc(x + 54, y + 11, 3.8, 0, Math.PI * 2);
                ctx.fill();

                const recoilOffset = shootRecoilTimer > 0 ? -8 : 0;
                const armX = x + 32 + recoilOffset;
                const armY = y + 32;
                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = '#64748b';
                ctx.lineWidth = 2;
                drawRoundedRect(ctx, armX + 18, armY - 2, 28, 20, 4);
                ctx.fill();
                ctx.stroke();
            }

            ctx.fillStyle = '#2E7D32';
            ctx.strokeStyle = '#052e16';
            ctx.lineWidth = 2;
            const frontLegX = x + 34 + legSwing * 0.65;
            drawRoundedRect(ctx, frontLegX, y + p.height - 28, 24, 28, 5);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        // [2] JETRAY (Supersonic Winged Aerophibian)
        function drawJetray(p, ult) {
            ctx.save();
            const x = p.x;
            const y = p.y;
            const wingFlap = Math.sin(p.legAngle * 1.3) * 14;
            const hoverOffset = Math.sin(p.legAngle * 0.8) * 4;
            ctx.translate(0, hoverOffset);

            // Hyperspace aura when Ultimate
            if (ult) {
                ctx.fillStyle = 'rgba(34, 211, 238, 0.16)';
                ctx.beginPath();
                ctx.ellipse(x + p.width / 2, y + p.height / 2, p.width * 0.68, p.height * 0.55, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Back Wing (Yellow ribbed manta wing)
            ctx.fillStyle = ult ? '#06b6d4' : '#facc15';
            ctx.strokeStyle = '#7f1d1d';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x + 28, y + 22);
            ctx.lineTo(x - 18, y + 8 - wingFlap);
            ctx.lineTo(x + 8, y + 48);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Aerophibian Torso (Crimson Red & Black)
            ctx.fillStyle = ult ? '#991b1b' : '#dc2626';
            ctx.strokeStyle = '#450a0a';
            ctx.lineWidth = 2.5;
            drawRoundedRect(ctx, x + 16, y + 16, 46, p.height - 26, 12);
            ctx.fill();
            ctx.stroke();

            // Front Wing
            ctx.fillStyle = ult ? '#22d3ee' : '#fde047';
            ctx.beginPath();
            ctx.moveTo(x + 36, y + 26);
            ctx.lineTo(x - 10, y + 36 + wingFlap);
            ctx.lineTo(x + 24, y + 54);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Horned Aerophibian Head Crest
            ctx.fillStyle = ult ? '#991b1b' : '#dc2626';
            ctx.beginPath();
            ctx.moveTo(x + 36, y + 18);
            ctx.lineTo(x + 22, y - 2);
            ctx.lineTo(x + 68, y + 6);
            ctx.lineTo(x + 76, y + 20);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Glowing Green Eyes (Laser Emitters)
            ctx.fillStyle = '#4ade80';
            ctx.beginPath();
            ctx.arc(x + 62, y + 13, 4, 0, Math.PI * 2);
            ctx.fill();

            drawOmnitrixSymbol(x + 46, y + 34, 8, ult);
            ctx.restore();
        }

        // [3] CANNONBOLT & ULTIMATE CANNONBOLT
        function drawCannonbolt(p, ult) {
            ctx.save();
            const isRolling = p.isDucking || p.specialDashTimer > 0 || !p.isGrounded;
            const cx = p.x + p.width / 2;
            const cy = p.y + p.height / 2;

            if (isRolling) {
                const r = Math.min(p.width, p.height) * 0.48;
                ctx.translate(cx, cy);
                ctx.rotate(p.rollAngle);

                // Kinetic Spikes in Ultimate Cannonbolt form
                if (ult) {
                    ctx.fillStyle = '#e2e8f0';
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 2;
                    for (let i = 0; i < 8; i++) {
                        const a = (Math.PI * 2 * i) / 8;
                        ctx.beginPath();
                        ctx.moveTo(Math.cos(a) * (r + 11), Math.sin(a) * (r + 11));
                        ctx.lineTo(Math.cos(a - 0.22) * (r - 2), Math.sin(a - 0.22) * (r - 2));
                        ctx.lineTo(Math.cos(a + 0.22) * (r - 2), Math.sin(a + 0.22) * (r - 2));
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    }
                }

                // Armored Sphere Shell
                ctx.fillStyle = ult ? '#3b82f6' : '#facc15';
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Inner White/Silver Core Stripe
                ctx.fillStyle = ult ? '#cbd5e1' : '#f8fafc';
                ctx.beginPath();
                ctx.arc(0, 0, r * 0.62, 0, Math.PI * 2);
                ctx.fill();

                // Black Equatorial Band
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(-r, 0);
                ctx.lineTo(r, 0);
                ctx.stroke();

                drawOmnitrixSymbol(0, 0, 8, ult);
            } else {
                const x = p.x;
                const y = p.y;
                const legSwing = Math.sin(p.legAngle) * 10;

                // Hulking Round Back Shell
                ctx.fillStyle = ult ? '#2563eb' : '#facc15';
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 2.5;
                drawRoundedRect(ctx, x + 4, y + 4, 62, 62, 26);
                ctx.fill();
                ctx.stroke();

                // White Belly & Face Area
                ctx.fillStyle = ult ? '#cbd5e1' : '#ffffff';
                drawRoundedRect(ctx, x + 22, y + 18, 40, 44, 16);
                ctx.fill();

                // Yellow/Green Eyes
                ctx.fillStyle = '#22c55e';
                ctx.beginPath();
                ctx.arc(x + 52, y + 26, 4, 0, Math.PI * 2);
                ctx.fill();

                drawOmnitrixSymbol(x + 44, y + 14, 8, ult);

                // Stumpy Legs
                ctx.fillStyle = '#e2e8f0';
                drawRoundedRect(ctx, x + 20 - legSwing * 0.5, y + p.height - 20, 18, 20, 5);
                ctx.fill();
                drawRoundedRect(ctx, x + 38 + legSwing * 0.5, y + p.height - 20, 18, 20, 5);
                ctx.fill();
            }
            ctx.restore();
        }

        // [4] XLR8 (Kineceleran Speedster)
        function drawXLR8(p, ult) {
            ctx.save();

            const y = p.y;

            // Speedster Lightning Blur Trail
            ctx.strokeStyle = ult ? '#22d3ee' : '#38bdf8';

            ctx.lineTo(x - 36 - Math.random() * 20, y + 46);
            ctx.stroke();
            ctx.globalAlpha = 1;

            // Blue & Black Striped Velociraptor Tail
            ctx.fillStyle = '#0284c7';
            ctx.strokeStyle = '#0f172a';

            ctx.beginPath();
            ctx.moveTo(x + 16, y + 42);
            ctx.lineTo(x - 36, y + 34 + Math.sin(p.legAngle) * 5);

            ctx.closePath();
            ctx.fill();

            // Pointed Black Helmet & Cyan Visor

            ctx.lineTo(x + 58, y + 24);
            ctx.closePath();
            ctx.fill();

        // [6] BIG CHILL & ULTIMATE BIG CHILL
        function drawBigChill(p, ult) {

        // [0] SECRET CODE 'RRR': UPCHUCK (Gourmand Tongue-Grabber & Acid Spitter)
        function drawUpchuck(p, ult) {
