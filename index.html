        /********************************************************************
         * 12. OBSTACLE, COLLECTIBLE & PROJECTILE ART
         ********************************************************************/
        function drawObstacle(obs) {
            ctx.save();
            if (obs.type === 'vilgax_spikes') {
                const spikes = obs.w > 50 ? 3 : 2;
                const sw = obs.w / spikes;
                for (let i = 0; i < spikes; i++) {
                    const sx = obs.x + i * sw;
                    ctx.fillStyle = '#1e293b';
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(sx + 2, obs.y + obs.h);
                    ctx.lineTo(sx + sw / 2, obs.y);
                    ctx.lineTo(sx + sw - 2, obs.y + obs.h);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }
            } else if (obs.type === 'knight_barrier') {
                ctx.fillStyle = '#334155';
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 2;
                drawRoundedRect(ctx, obs.x + 6, obs.y, obs.w - 12, obs.h, 6);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#ef4444';
                for (let py = obs.y + 10; py < obs.y + obs.h - 10; py += 16) {
                    ctx.fillRect(obs.x + 2, py, obs.w - 4, 8);
                }
            } else if (obs.type === 'dnalien_pod') {
                ctx.fillStyle = '#581c87';
                ctx.strokeStyle = '#c084fc';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(obs.x + obs.w / 2, obs.y + obs.h / 2 + 4, obs.w / 2 - 2, Math.PI, 0, false);
                ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
                ctx.lineTo(obs.x, obs.y + obs.h);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#4ade80';
                ctx.beginPath();
                ctx.arc(obs.x + obs.w * 0.38, obs.y + obs.h * 0.45, 5, 0, Math.PI * 2);
                ctx.arc(obs.x + obs.w * 0.65, obs.y + obs.h * 0.55, 4, 0, Math.PI * 2);
                ctx.fill();
            } else if (obs.type === 'vilgax_drone') {
                const cy = obs.y + obs.h / 2;
                ctx.fillStyle = '#f97316';
                ctx.beginPath();
                ctx.moveTo(obs.x + obs.w - 4, cy - 5);
                ctx.lineTo(obs.x + obs.w + 14 + Math.random() * 6, cy);
                ctx.lineTo(obs.x + obs.w - 4, cy + 5);
                ctx.fill();

                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 2;
                drawRoundedRect(ctx, obs.x + 6, obs.y + 4, obs.w - 12, obs.h - 8, 10);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(obs.x + 18, cy, 6, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawCollectible(c) {
            ctx.save();
            const cx = c.x + c.w / 2;
            const cy = c.y + c.h / 2;

            if (c.type === 'orb') {
                ctx.fillStyle = 'rgba(34, 197, 94, 0.28)';
                ctx.beginPath();
                ctx.arc(cx, cy, 18, 0, Math.PI * 2);
                ctx.fill();
                drawOmnitrixSymbol(cx, cy, 12, false);
            } else {
                ctx.strokeStyle = '#ec4899';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(cx + 2, cy - 8);
                ctx.lineTo(cx + 8, cy - 18);
                ctx.stroke();

                ctx.fillStyle = '#fef08a';
                ctx.strokeStyle = '#ca8a04';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(cx - 10, cy - 6);
                ctx.lineTo(cx + 10, cy - 6);
                ctx.lineTo(cx + 7, cy + 14);
                ctx.lineTo(cx - 7, cy + 14);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(cx, cy - 6, 10, Math.PI, 0);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawProjectile(m) {
            ctx.save();
            if (m.kind === 'upchuck_spit') {
                // Glowing Gourmand Explosive Acid Loogie Ball
                ctx.fillStyle = '#a3e635';
                ctx.strokeStyle = '#ecfccb';
                ctx.lineWidth = 2.5;
                ctx.shadowColor = '#84cc16';
                ctx.shadowBlur = 14;
                ctx.beginPath();
                ctx.arc(m.x + m.w / 2, m.y + m.h / 2, m.h / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            } else if (m.kind === 'neuro_laser') {
                ctx.fillStyle = m.color || '#4ade80';
                ctx.shadowColor = m.color || '#4ade80';
                ctx.shadowBlur = 10;
                drawRoundedRect(ctx, m.x, m.y, m.w, m.h, 4);
                ctx.fill();
            } else if (m.kind === 'methane_fire' || m.kind === 'blue_napalm') {
                ctx.fillStyle = m.color;
                ctx.beginPath();
                ctx.arc(m.x + m.w / 2, m.y + m.h / 2, m.h / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.arc(m.x + m.w / 2, m.y + m.h / 2, m.h * 0.28, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#e2e8f0';
                ctx.strokeStyle = m.color || '#22c55e';
                ctx.lineWidth = 2.5;
                drawRoundedRect(ctx, m.x, m.y, m.w, m.h, 5);
                ctx.fill();
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawRoundedRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        /********************************************************************
         * 13. INPUT LISTENERS & CLEAN SOUND TOGGLE
         ********************************************************************/
        const soundToggleBtn = document.getElementById('soundToggleBtn');

        // Bind Omnitrix Alien Roster Cards
        document.querySelectorAll('.alien-card').forEach(card => {
            card.addEventListener('click', () => {
                selectAlien(card.dataset.alien, true);
            });
        });

        // Secret Code 'RRR' Input & Button Handler
        const secretCodeInput = document.getElementById('secretCodeInput');
        const secretCodeBtn = document.getElementById('secretCodeBtn');
        const unlockAllBtn = document.getElementById('unlockAllBtn');

        if (secretCodeInput) {
            secretCodeInput.addEventListener('input', (e) => {
                if (e.target.value.trim().toUpperCase() === 'RRR') {
                    unlockSecretRRR();
                    e.target.blur();
                }
            });
        }
        if (secretCodeBtn) {
            secretCodeBtn.addEventListener('click', () => {
                unlockSecretRRR();
            });
        }
        if (unlockAllBtn) {
            unlockAllBtn.addEventListener('click', () => {
                audio.init();
                handleLevelUp(currentLevel + 1);
            });
        }

        document.getElementById('cycleAlienBtn').addEventListener('click', () => {
            cycleAlienRoster();
        });

        document.getElementById('btnSwapAlien').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            cycleAlienRoster();
        });

        function toggleAllSound() {
            const isMusicOn = audio.toggleMusic();
            audio.sfxEnabled = isMusicOn;
            audio.updateVolumes();
            if (soundToggleBtn) {
                if (isMusicOn) {
                    soundToggleBtn.textContent = 'SOUND: ON';
                    soundToggleBtn.className = 'px-2 py-1 rounded-lg bg-emerald-500/20 border border-emerald-400/50 text-emerald-300 font-orbitron font-bold text-[9px] sm:text-[10px] cursor-pointer shrink-0';
                } else {
                    soundToggleBtn.textContent = 'SOUND: OFF';
                    soundToggleBtn.className = 'px-2 py-1 rounded-lg bg-slate-900 border border-red-500/40 text-red-300 font-orbitron font-bold text-[9px] sm:text-[10px] cursor-pointer shrink-0';
                }
            }
        }

        if (soundToggleBtn) {
            soundToggleBtn.addEventListener('click', toggleAllSound);
        }

        window.addEventListener('orientationchange', () => {
            setTimeout(resizeCanvas, 120);
        });

        window.addEventListener('keydown', (e) => {
            // Ignore shortcuts when typing inside the Secret Code input box
            if (document.activeElement && document.activeElement.id === 'secretCodeInput') {
                if (e.code === 'Enter' && secretCodeInput.value.trim().toUpperCase() === 'RRR') {
                    unlockSecretRRR();
                    secretCodeInput.blur();
                }
                return;
            }

            // Detect Secret Code 'RRR' typed anywhere during gameplay or menu!
            if (e.key && e.key.length === 1) {
                rrrKeyBuffer = (rrrKeyBuffer + e.key.toUpperCase()).slice(-3);
                if (rrrKeyBuffer === 'RRR') {
                    unlockSecretRRR();
                    rrrKeyBuffer = '';
                    return;
                }
            }

            if (['Space', 'ArrowUp', 'ArrowDown', 'KeyW', 'KeyS'].includes(e.code)) {
                e.preventDefault();
            }

            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                if (!e.repeat) {
                    handleJump();
                }
                jumpKeyHeld = true;
                document.getElementById('btnJump').classList.add('pressed');
            } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
                setDucking(true);
                document.getElementById('btnDuck').classList.add('pressed');
            } else if (e.code === 'KeyX' || e.code === 'KeyF') {
                if (!e.repeat) {
                    triggerAlienSpecial();
                    document.getElementById('btnShoot').classList.add('pressed');
                }
            } else if (e.code === 'KeyE') {
                if (!e.repeat && gameState === 'PLAYING') {
                    triggerUltimateEvolution();
                    document.getElementById('btnEvolve').classList.add('pressed');
                }
            } else if (e.code === 'KeyQ') {
                if (!e.repeat) {
                    cycleAlienRoster();
                    document.getElementById('btnSwapAlien').classList.add('pressed');
                }
            } else if (e.code === 'KeyM') {
                if (!e.repeat) {
                    toggleAllSound();
                }
            } else if (['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6', 'Digit7', 'Digit8', 'Digit9', 'Digit0'].includes(e.code)) {
                if (!e.repeat) {
                    const digit = parseInt(e.code.replace('Digit', ''), 10);
                    const idx = digit === 0 ? 9 : digit - 1;
                    if (ALIEN_KEYS[idx]) {
                        selectAlien(ALIEN_KEYS[idx], true);
                    }
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                jumpKeyHeld = false;
                document.getElementById('btnJump').classList.remove('pressed');
            } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
                setDucking(false);
                document.getElementById('btnDuck').classList.remove('pressed');
            } else if (e.code === 'KeyX' || e.code === 'KeyF') {
                document.getElementById('btnShoot').classList.remove('pressed');
            } else if (e.code === 'KeyE') {
                document.getElementById('btnEvolve').classList.remove('pressed');
            } else if (e.code === 'KeyQ') {
                document.getElementById('btnSwapAlien').classList.remove('pressed');
            }
        });

        const btnJump = document.getElementById('btnJump');
        const btnDuck = document.getElementById('btnDuck');
        const btnShoot = document.getElementById('btnShoot');
        const btnEvolve = document.getElementById('btnEvolve');

        btnJump.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            jumpKeyHeld = true;
            handleJump();
        });
        btnJump.addEventListener('pointerup', () => { jumpKeyHeld = false; });
        btnJump.addEventListener('pointerleave', () => { jumpKeyHeld = false; });

        btnDuck.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            setDucking(true);
        });
        btnDuck.addEventListener('pointerup', () => { setDucking(false); });
        btnDuck.addEventListener('pointerleave', () => { setDucking(false); });
        btnDuck.addEventListener('pointercancel', () => { setDucking(false); });

        btnShoot.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            triggerAlienSpecial();
        });

        btnEvolve.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            audio.init();
            if (gameState !== 'PLAYING') {
                startGame();
            } else {
                triggerUltimateEvolution();
            }
        });

        startBtn.addEventListener('click', () => {
            startGame();
        });

        // Canvas Touch / Swipe Gestures for Mobile
        let touchStartY = null;
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (touchStartY !== null && e.touches.length > 0) {
                const dy = e.touches[0].clientY - touchStartY;
                if (dy > 28) {
                    setDucking(true);
                }
            }
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            if (touchStartY !== null && e.changedTouches.length > 0) {
                const dy = e.changedTouches[0].clientY - touchStartY;
                if (dy < 22 && !player.isDucking) {
                    handleJump();
                }
            }
            setDucking(false);
            touchStartY = null;
        }, { passive: true });

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
            lastTime = timestamp;

            updateGame(dt);
            drawGame();

            requestAnimationFrame(gameLoop);
        }

        window.onload = function () {
            resizeCanvas();
            selectAlien(currentAlienKey, false);
            updateHUD();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
